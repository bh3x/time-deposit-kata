spring:
  application:
    name: time-deposit-service
  # ADR-0005: the application maps only the two contract operations. Spring Boot's /error route (BasicErrorController
  # from ErrorMvcAutoConfiguration) is removed rather than argued away; errors handled by Spring MVC are Problem
  # Details anyway, and errors outside it get the servlet container's default response (accepted in ADR-0005).
  autoconfigure:
    exclude: org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
  # ADR-0005: no static-resource handler, so no path is served from the classpath (e.g. /index.html, /favicon.ico).
  web:
    resources:
      add-mappings: false
  jpa:
    # The schema is owned by Flyway (ADR-0006); Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # No lazy loading during web rendering: entities never leave the persistence adapter (ADR-0008).
    open-in-view: false
  # Spring MVC's own errors (e.g. 405) as RFC 9457 Problem Details (ADR-0003); other exceptions are handled by
  # shared.adapter.in.rest.ProblemDetailsHandler.
  mvc:
    problemdetails:
      enabled: true
# Browser origins allowed to call the API (ADR-0010): the Swagger UI container of the Compose stack.
app:
  cors:
    allowed-origins: http://localhost:8081
