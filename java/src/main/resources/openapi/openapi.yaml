openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: >
    Contract-first API for XA Bank time deposits.
    Endpoints are defined in a later increment (see docs/adr).
servers:
  - url: /api/v1
    description: Relative to the host serving the API
paths: {}
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details (application/problem+json).
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
