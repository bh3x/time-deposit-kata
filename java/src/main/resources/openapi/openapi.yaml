openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: >
    Contract-first API for XA Bank time deposits. Design decisions are recorded in docs/adr.
servers:
  - url: /api/v1
    description: Relative to the host serving the API
security: []  # no authentication: not required by the brief (see ADR-0004)
tags:
  - name: TimeDeposits
    description: Time deposits and their balances
paths:
  /time-deposits:
    get:
      operationId: listTimeDeposits
      tags: [TimeDeposits]
      summary: List all time deposits
      description: >
        Returns all time deposits with their withdrawals. The order is not guaranteed.
      responses:
        '200':
          description: All time deposits (empty array if none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDeposits'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    TimeDeposits:
      type: array
      description: >
        All time deposits. The order of items is not guaranteed; clients must not rely on it.
      items:
        $ref: '#/components/schemas/TimeDeposit'
    TimeDeposit:
      type: object
      description: A time deposit with its current balance and withdrawals.
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: string
          format: uuid
          description: Public identifier (random UUID v4). Not the internal database key.
          example: 3f2a6c1e-8b7d-4e2a-9c41-7d5e0b6a9f12
        planType:
          type: string
          description: Plan of the time deposit; case-sensitive. New plan types may be added.
          x-extensible-enum: [basic, student, premium]
          example: premium
        balance:
          description: Current balance, including all interest applied so far.
          allOf:
            - $ref: '#/components/schemas/Amount'
        days:
          type: integer
          format: int32
          minimum: 0
          description: >
            Number of days since the time deposit was opened; drives the interest rules.
            Assumption: the brief does not define this field.
          example: 120
        withdrawals:
          type: array
          description: >
            History of withdrawals from this time deposit; empty if none.
            The balance is already net of these withdrawals.
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      description: A withdrawal from a time deposit.
      required: [id, amount, date]
      properties:
        id:
          type: string
          format: uuid
          description: Public identifier (random UUID v4). Not the internal database key.
          example: 9b1d4c7a-2e3f-4a5b-8c6d-0e1f2a3b4c5d
        amount:
          description: Amount withdrawn.
          allOf:
            - $ref: '#/components/schemas/Amount'
        date:
          type: string
          format: date
          example: '2026-09-15'
    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Monetary amount as a decimal string with exactly two fraction digits (single currency).
      example: '10000.00'
    Problem:
      type: object
      description: RFC 9457 Problem Details (application/problem+json).
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
